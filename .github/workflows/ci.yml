
name: Website Monitor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting
        run: black --check monitor.py app.py test_monitor.py

      - name: Run lint checks
        run: flake8 monitor.py app.py test_monitor.py --max-line-length=88

      - name: Run tests
        run: python -m pytest -v

      - name: Validate Docker image build
        run: docker build -t website-uptime-monitor .
